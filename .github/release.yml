changelog:
  exclude:
    labels:
      - skip-release-notes
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Performance and reliability
      labels:
        - performance
        - reliability
    - title: Engineering and documentation
      labels:
        - documentation
        - dependencies
        - ci
        - build
    - title: Other changes
      labels:
        - "*"
