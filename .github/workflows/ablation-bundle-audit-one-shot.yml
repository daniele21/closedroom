name: Temporary finalized-bundle footprint source checks

on:
  pull_request:
    branches: [experiment/complexity-ablation]
    types: [opened]

permissions:
  contents: read

jobs:
  audit-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert experiment-only validation target
        env:
          BASE_REF: ${{ github.base_ref }}
        run: test "$BASE_REF" = "experiment/complexity-ablation"
      - name: Focused standard-library tests and syntax
        run: |
          python3 -m py_compile scripts/audit_footprint.py test/test_audit_footprint.py
          python3 -m unittest discover -s test -p 'test_audit_footprint.py' -v
          git diff --check
