name: E4/E5 isolated ablation regression (one-shot)

on:
  pull_request:
    branches: [experiment/complexity-ablation]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  scoped:
    runs-on: macos-14
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Verify experiment base only
        env:
          PR_BASE: ${{ github.base_ref }}
        run: test "$PR_BASE" = "experiment/complexity-ablation"
      - name: Python projection contract (isolated test-only dependencies)
        run: |
          python3 -m venv /tmp/closedroom-e5-test
          /tmp/closedroom-e5-test/bin/python -m pip install "Pillow==12.0.0"
          /tmp/closedroom-e5-test/bin/python -m py_compile src/local_asr_server/recordings.py test/test_visual_evidence_projection_ablation.py
          PYTHONPATH=src /tmp/closedroom-e5-test/bin/python -m unittest discover -s test -p 'test_visual_evidence_projection_ablation.py' -v
          PYTHONPATH=src /tmp/closedroom-e5-test/bin/python -m unittest discover -s test -p 'test_recording_notes.py' -v
      - name: Frontend dependencies (no macOS app build)
        run: |
          npm install --global pnpm@9.15.9
          cd frontend && pnpm install --frozen-lockfile
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Source syntax, lint and TypeScript
        run: |
          node --check scripts/browser_saved_meeting_e2e.mjs
          cd frontend && pnpm run lint && pnpm exec tsc --noEmit
      - name: Meeting screenshot scope and existing load/retry races
        run: E2E_SOURCE_REVISION="$GITHUB_SHA" node scripts/browser_saved_meeting_e2e.mjs
      - name: Check no accidental edits
        run: git diff --check
