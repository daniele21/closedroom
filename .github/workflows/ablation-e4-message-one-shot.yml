name: E4 recording UI messages one-shot source checks

on:
  pull_request:
    branches: [experiment/complexity-ablation]
    types: [opened]

permissions:
  contents: read

jobs:
  ui-messages:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify isolated experiment target
        env:
          BASE: ${{ github.base_ref }}
        run: test "$BASE" = "experiment/complexity-ablation"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install only frontend test dependencies
        run: |
          npm install -g pnpm@9.15.9
          cd frontend && pnpm install --frozen-lockfile
      - name: Exercise shared message behavior and source contracts
        run: |
          node --check scripts/test_capture_permission_messages.mjs
          node scripts/test_capture_permission_messages.mjs
      - name: Frontend lint and TypeScript
        run: |
          cd frontend
          pnpm run lint
          pnpm exec tsc --noEmit
      - name: Source hygiene
        run: git diff --check
