name: E4 overlay fallback single-owner ablation (one-shot)

on:
  pull_request:
    branches: [experiment/complexity-ablation]
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  scoped:
    runs-on: macos-14
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Ensure experiment branch only
        env:
          BASE: ${{ github.base_ref }}
        run: test "$BASE" = "experiment/complexity-ablation"
      - name: Relevant frontend source contract tests
        run: |
          python3 -m unittest discover -s test -p 'test_frontend_call_screenshot_evidence.py' -v
          python3 -m unittest discover -s test -p 'test_frontend_recording_efficiency.py' -v
      - name: Frontend dependencies and source diagnostics
        run: |
          npm install --global pnpm@9.15.9
          cd frontend
          pnpm install --frozen-lockfile
          pnpm run lint
          pnpm exec tsc --noEmit
      - name: Adjacent overlay/browser integration fixture (no native app build)
        run: |
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          E2E_SOURCE_REVISION="$GITHUB_SHA" node scripts/browser_call_overlay_screenshot_e2e.mjs
      - name: Source diff hygiene
        run: git diff --check
