name: Temporary meeting load-coordination ablation verification

# Disposable source/browser-only gate. Close the validation PR without merge.
on:
  pull_request:
    branches: [experiment/complexity-ablation]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  scoped:
    name: TypeScript and meeting browser journeys
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Assert isolated experiment target
        run: |
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_BASE_REF" = "experiment/complexity-ablation"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install source-only test prerequisites
        run: |
          npm install --global pnpm@9.15.9
          cd frontend && pnpm install --frozen-lockfile
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Frontend source lint and typecheck
        run: cd frontend && pnpm run lint && pnpm exec tsc --noEmit
      - name: Meeting preparation reconnect and recovery
        run: E2E_SOURCE_REVISION="$GITHUB_SHA" node scripts/browser_meeting_preparation_e2e.mjs
      - name: Saved meeting journey
        run: E2E_SOURCE_REVISION="$GITHUB_SHA" node scripts/browser_saved_meeting_e2e.mjs
