name: Temporary Meeting cross-recording race validation

on:
  pull_request:
    branches: [experiment/complexity-ablation]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  scoped:
    name: Source contracts and two synthetic Meeting journeys
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Confirm isolated experimental base
        run: |
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_BASE_REF" = "experiment/complexity-ablation"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Source-only browser dependencies, no macOS app build
        run: |
          npm install --global pnpm@9.15.9
          cd frontend && pnpm install --frozen-lockfile
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Syntax check browser fixture
        run: node --check scripts/browser_saved_meeting_e2e.mjs
      - name: Frontend lint and TypeScript contracts
        run: cd frontend && pnpm run lint && pnpm exec tsc --noEmit
      - name: Meeting stale response races and accessory recovery
        run: E2E_SOURCE_REVISION="$GITHUB_SHA" node scripts/browser_saved_meeting_e2e.mjs
      - name: Meeting preparation reconnect and recovery
        run: E2E_SOURCE_REVISION="$GITHUB_SHA" node scripts/browser_meeting_preparation_e2e.mjs
