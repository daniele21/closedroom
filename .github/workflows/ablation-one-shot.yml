name: Temporary complexity-ablation source check

# Third and final branch-only check: the preceding run passed all Python
# and TypeScript gates; this isolates the missing ffmpeg browser environment.
on:
  pull_request:
    branches: [experiment/complexity-ablation]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: complexity-ablation-once
  cancel-in-progress: true

jobs:
  focused:
    name: Call overlay browser E2E only
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify experiment base and source
        run: |
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_BASE_REF" = "experiment/complexity-ablation"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install only browser E2E prerequisites
        run: |
          npm install --global pnpm@9
          cd frontend && pnpm install --frozen-lockfile
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Call overlay screenshot and notes browser E2E
        run: |
          E2E_SOURCE_REVISION="$GITHUB_SHA" node scripts/browser_call_overlay_screenshot_e2e.mjs
