name: Temporary complexity-ablation browser verification

# Branch-only disposable experiment gate. Close PR and delete this file after evidence.
on:
  pull_request:
    branches: [experiment/complexity-ablation]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
concurrency:
  group: complexity-ablation-scoped-browser
  cancel-in-progress: true
jobs:
  scoped:
    name: Frontend contracts and two browser journeys
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify no dev integration
        run: |
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_BASE_REF" = "experiment/complexity-ablation"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Source-only browser toolchain
        run: |
          npm install --global pnpm@9
          cd frontend && pnpm install --frozen-lockfile
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Frontend lint and static types
        run: |
          cd frontend && pnpm run lint && pnpm exec tsc --noEmit
      - name: Overlay screenshot and note journey
        run: |
          E2E_SOURCE_REVISION="$GITHUB_SHA" node scripts/browser_call_overlay_screenshot_e2e.mjs
      - name: Meeting preparation recovery journey
        run: |
          E2E_SOURCE_REVISION="$GITHUB_SHA" node scripts/browser_meeting_preparation_e2e.mjs
