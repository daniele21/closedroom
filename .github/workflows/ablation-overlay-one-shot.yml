name: Temporary overlay ablation contract check

# Only PRs targeting the experimental branch trigger this one-off source gate.
on:
  pull_request:
    branches: [experiment/complexity-ablation]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  overlay:
    name: TypeScript, lint and synthetic overlay journey
    runs-on: macos-14
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Assert experimental target
        run: |
          test "$GITHUB_EVENT_NAME" = "pull_request"
          test "$GITHUB_BASE_REF" = "experiment/complexity-ablation"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Prepare frontend and browser tools (no app build)
        run: |
          npm install --global pnpm@9
          cd frontend && pnpm install --frozen-lockfile
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Frontend lint and type contracts
        run: cd frontend && pnpm run lint && pnpm exec tsc --noEmit
      - name: Overlay screenshot, close/reopen note and stop journey
        run: E2E_SOURCE_REVISION="$GITHUB_SHA" node scripts/browser_call_overlay_screenshot_e2e.mjs
