name: Temporary demo video fidelity audit (no app build)

on:
  pull_request:
    branches: [experiment/complexity-ablation]
    types: [opened]

permissions:
  contents: write

jobs:
  compress-demo-only:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - name: Verify isolated branch and known head
        env:
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          test "$PR_BASE" = "experiment/complexity-ablation"
          test "$PR_HEAD" = "experiment/complexity-ablation-video-validation"
          test "$PR_REPO" = "$GITHUB_REPOSITORY"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
      - name: Ensure native video codecs are present
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -hide_banner -encoders | grep libx264
      - name: Deterministic gate tests with synthetic video
        run: python3 -m unittest discover -s test -p 'test_optimize_reference_video.py' -v
      - name: Inspect original public documentation video streams
        run: |
          ffprobe -v error -show_entries format=duration,size:stream=index,codec_type,codec_name,width,height,pix_fmt,avg_frame_rate,sample_rate,channels -of json docs/assets/Closed-Room-demo.mov
      - name: Trial high-fidelity source-only compression; keep original unless PASS
        run: |
          python3 scripts/optimize_reference_video.py --apply | tee /tmp/closedroom-video-metrics.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('/tmp/closedroom-video-metrics.json').read_text())
          assert m['accepted'] and m['applied'], m
          assert m['saved_percent'] >= 25.0, m
          assert m['ssim_average'] >= 0.985 and m['ssim_worst_frame'] >= 0.94, m
          print("PASS high-fidelity video optimization:",m['saved_bytes'],"bytes,",m['frames_compared'],"frames")
          PY
          git diff --check
          git add docs/assets/Closed-Room-demo.mov
          git diff --cached --check
          python3 - <<'PY'
          import subprocess
          changed=subprocess.check_output(['git','diff','--cached','--name-only']).decode().splitlines()
          assert changed == ['docs/assets/Closed-Room-demo.mov'], changed
          PY
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git commit -m "perf(experiment): shrink public documentation demo with fidelity gates"
          git push origin HEAD:"$GITHUB_HEAD_REF"
