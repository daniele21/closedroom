[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-asr-server"
version = "0.1.0"
description = "Local ASR server with OpenAI-compatible transcription endpoint, powered by MLX Whisper."
readme = "README.md"
# onnxruntime 1.23.x currently publishes macOS wheels through CPython 3.13,
# not 3.14. Keep package metadata truthful until the runtime dependency supports
# cp314 and ClosedRoom verifies that combination.
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "mlx-whisper",
    "mlx-audio[stt]",
    # mlx 0.32.0 currently breaks MLX GPU stream ownership in the frozen
    # mlx-vlm worker. Keep the bundle aligned with the runtime verified by the
    # lockfile and the development environment until the upstream regression
    # is resolved.
    "mlx==0.31.2; sys_platform == 'darwin'",
    "onnxruntime>=1.14.0,<1.24.0",
    # Local LLM/VLM control plane. Pin the validated repository source to an
    # immutable Git revision so clean builds compile exactly the same runtime
    # while still allowing ClosedRoom to consume post-release resource fixes.
    "local-llm-server[vision] @ git+https://github.com/daniele21/local-llm-server.git@53500af8c1e1df1c92937b18928790fded8b437f",
    # Audio preprocessing for Voxtral multimodal analysis
    "soundfile>=0.12.0",
    "numpy>=1.24.0",
    # Exposed directly in the transcription workflow, so development installs
    # must support Speechmatics without requiring a hidden optional extra.
    "speechmatics-batch>=0.5.0",
]

[project.optional-dependencies]
# macOS menu bar mode — install with: uv pip install -e ".[app]"
app = [
    "rumps>=0.4.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pynput>=1.7.6",
]
# Build tooling — install with: uv pip install -e ".[build]"
build = [
    "pyinstaller>=6.0",
]
# Backward-compatible extra for existing setup commands. The SDK is now a core
# dependency because Speechmatics diarization is selectable in the main UI.
speechmatics = []

[project.scripts]
local-asr = "local_asr_server.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
local_asr_server = [
    "static/*",
    "static/**/*",
    "macos_audio_helper/*.swift",
    "native_capture_helper/*.swift",
    "speaker_diarization_helper/Package.swift",
    "speaker_diarization_helper/Package.resolved",
    "speaker_diarization_helper/Sources/*.swift",
]
